name: Release 0xProtoD2 Fonts

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release files
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import shutil
          import sys
          import zipfile

          sys.path.insert(0, "scripts")
          from config import (
              BUILT_FONTS_PATH,
              BUILT_FONT_VERSION_PATH,
              EN_FONT_VERSION_PATH,
              FONT_FAMILY_ALIASES,
              get_release_archive_name,
              KO_FONT_VERSION_PATH,
              RELEASE_FILES_PATH,
              RELEASE_NOTES_PATH,
          )

          required_path_templates = [
              "{family}-Regular.ttf",
              "{family}-Regular.woff2",
              "{family}-Bold.ttf",
              "{family}-Bold.woff2",
              "{family}-Italic.ttf",
              "{family}-Italic.woff2",
              "{family}-NerdFontMono-Regular.ttf",
              "{family}-NerdFontMono-Bold.ttf",
              "{family}-NerdFontMono-Italic.ttf",
              "NL/{family}-NL-Regular.ttf",
              "NL/{family}-NL-Regular.woff2",
              "NL/{family}-NL-Bold.ttf",
              "NL/{family}-NL-Bold.woff2",
              "NL/{family}-NL-Italic.ttf",
              "NL/{family}-NL-Italic.woff2",
              "NL/{family}-NL-NerdFontMono-Regular.ttf",
              "NL/{family}-NL-NerdFontMono-Bold.ttf",
              "NL/{family}-NL-NerdFontMono-Italic.ttf",
          ]

          built_fonts_dir = Path(BUILT_FONTS_PATH)
          release_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          built_font_version_path = Path(BUILT_FONT_VERSION_PATH)
          if not built_font_version_path.is_file():
              raise SystemExit(f"[ERROR] Missing built font version: {built_font_version_path}")
          built_font_version = built_font_version_path.read_text(encoding="utf-8").strip()
          if built_font_version != release_version:
              raise SystemExit(
                  f"[ERROR] Built font version {built_font_version} does not match release {release_version}"
              )

          release_dir = Path(RELEASE_FILES_PATH)
          shutil.rmtree(release_dir, ignore_errors=True)
          release_dir.mkdir(parents=True, exist_ok=True)

          for family_name in FONT_FAMILY_ALIASES:
              family_dir = built_fonts_dir / family_name
              if not family_dir.is_dir():
                  raise SystemExit(f"[ERROR] Missing built font directory: {family_dir}")

              for path_template in required_path_templates:
                  font_path = family_dir / path_template.format(family=family_name)
                  if not font_path.is_file():
                      raise SystemExit(f"[ERROR] Missing release font: {font_path}")

              nerd_webfonts = list(family_dir.rglob("*NerdFontMono*.woff2"))
              if nerd_webfonts:
                  raise SystemExit(
                      f"[ERROR] Nerd Font webfonts should not be released: {nerd_webfonts[0]}"
                  )

              archive_path = release_dir / get_release_archive_name(
                  family_name,
                  release_version,
              )
              with zipfile.ZipFile(archive_path, "w", zipfile.ZIP_DEFLATED) as archive:
                  for path in sorted(family_dir.rglob("*")):
                      if path.is_file():
                          archive.write(path, path.relative_to(family_dir))

          release_notes_lines = [
              "0xProtoD2 font release.",
              "",
              "## Source Font Versions",
              f"- 0xProto: {Path(EN_FONT_VERSION_PATH).read_text(encoding='utf-8').strip()}",
              f"- D2Coding: {Path(KO_FONT_VERSION_PATH).read_text(encoding='utf-8').strip()}",
              "",
              "## Each archive contains",
              "- Ligature fonts: TTF and WOFF2",
              "- No-ligature fonts (`NL`): TTF and WOFF2",
              "- Regular, Bold, and Italic styles",
              "- Nerd Font Mono fonts (`NerdFontMono`, `NL-NerdFontMono`): TTF only",
              "",
          ]
          release_notes = "\n".join(release_notes_lines)
          Path(RELEASE_NOTES_PATH).write_text(release_notes, encoding="utf-8")
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*.zip
          name: Release ${{ github.ref_name }}
          body_path: release_files/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
